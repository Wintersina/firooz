<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5865F2"/>
      <stop offset="100%" style="stop-color:#7B68EE"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="250" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="250" fill="url(#shine)"/>

  <!-- Karma arrow (up arrow) -->
  <g transform="translate(256, 220)">
    <!-- Up arrow body -->
    <rect x="-25" y="-20" width="50" height="100" rx="10" fill="#57F287"/>
    <!-- Up arrow head -->
    <polygon points="0,-80 -55,-15 -30,-15 -30,-20 30,-20 30,-15 55,-15" fill="#57F287"/>
  </g>

  <!-- Plus plus text -->
  <text x="256" y="400" font-family="Arial, Helvetica, sans-serif" font-size="90" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="5">++</text>

  <!-- Small sparkles -->
  <text x="120" y="140" font-size="40" fill="#FEE75C" opacity="0.9">&#x2728;</text>
  <text x="370" y="160" font-size="30" fill="#FEE75C" opacity="0.7">&#x2B50;</text>
  <text x="390" y="350" font-size="35" fill="#FEE75C" opacity="0.8">&#x2728;</text>
  <text x="100" y="330" font-size="28" fill="#FEE75C" opacity="0.6">&#x2B50;</text>
</svg>
